name: Agent Evaluation & CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  eval-and-test:
    name: Run Unit Tests & Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from template
        run: cp .env.example .env

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Run agent evaluation suite (Mock Mode)
        run: python -m src.runner
