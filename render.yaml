services:
  - type: web
    name: agentpulse-console
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_MOCK_LLM
        value: "true"
      - key: AGENTPULSE_AUTH_KEY
        value: ap_sec_render_live_deploy_8849c0182b
      - key: AGENTPULSE_API_KEY
        value: ap_live_render_telemetry_2910fae77c
      - key: ANTHROPIC_API_KEY
        value: sk-ant-api03-render-mock-credentials
      - key: DATABASE_URL
        value: sqlite:///./eval_framework.db
