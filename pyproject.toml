[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpulse"
version = "1.0.0"
description = "Lightweight, zero-overhead observability and evaluation SDK for AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AgentPulse Team"}
]
keywords = ["agents", "llm", "observability", "evaluation", "tracing", "mcp"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentpulse*"]

[tool.pytest.ini_options]
pythonpath = ["."]

